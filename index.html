<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaasir — Software Developer</title>
    <!-- Modern Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Subtle Grid Pattern Background -->
    <div class="bg-grid"></div>

    <!-- Header Navigation -->
    <nav class="navbar">
        <div class="logo">Jaasir <span class="dot">.</span></div>
        <ul class="nav-links">
            <li><a href="#professional" class="active">Professional</a></li>
            <li><a href="#personal">Personal</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="status-btn">
            <span class="status-dot"></span> Available for projects
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="hero">
        <div class="hero-text">
            <span class="role-tag">Software Developer</span>
            <h1>Hello I'm <br><span class="name-highlight">Jaasir</span></h1>
            <p class="subtitle">System-oriented | Data Analysis | Web Apps</p>
            <div class="hero-actions">
                <a href="#projects" class="btn-primary">Explore Work</a>
                <a href="https://github.com/jaasir7-dev" target="_blank" class="btn-secondary">GitHub Profile &rarr;</a>
            </div>
        </div>

        <!-- Avatar Container with Animated Tech Ring -->
        <div class="hero-avatar-wrapper">
            <div class="animated-ring"></div>
            <div class="avatar-frame">
                <!-- Using your uploaded LinkedIn DP -->
                <img src="LinkedIn DP.jpeg" alt="Jaasir Profile" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600'">
            </div>
        </div>
    </main>

    <!-- Dynamic Interactive Music Widget (Bottom Left) -->
    <div class="music-widget">
        <div class="disc-icon" id="disc">🎵</div>
        <div class="music-info">
            <span class="track-title" id="track-title">Aruarian Dance</span>
            <span class="track-artist" id="track-artist">Nujabes</span>
        </div>
        <button class="play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
        <!-- Sample lo-fi audio stream -->
        <audio id="bgAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <script>
        // Interactive Music Player Logic
        const audio = document.getElementById('bgAudio');
        const playBtn = document.getElementById('playBtn');
        const disc = document.getElementById('disc');

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = '❚❚';
                disc.classList.add('spinning');
            } else {
                audio.pause();
                playBtn.innerText = '▶';
                disc.classList.remove('spinning');
            }
        }
    </script>
</body>
</html>
